name: Compiled simulator correctness and benchmarks
on:
  push:
    paths:
      - 'src/SharpHDL/**'
      - 'examples/TinyRisc/**'
      - 'tests/SharpHDL.UnitTests/**'
      - 'tests/benchmark-tinyrisc-backends.sh'
      - 'tools/SharpHDL.SimulatorBench/**'
      - '.github/workflows/compiled-simulator.yml'
  pull_request:
    paths:
      - 'src/SharpHDL/**'
      - 'examples/TinyRisc/**'
      - 'tests/SharpHDL.UnitTests/**'
      - 'tests/benchmark-tinyrisc-backends.sh'
      - '.github/workflows/compiled-simulator.yml'
  workflow_dispatch:
jobs:
  regression-and-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install open HDL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - name: Tool versions
        run: |
          dotnet --version
          verilator --version
          yosys -V
      - name: Compiled simulator xUnit regression
        run: dotnet test tests/SharpHDL.UnitTests/SharpHDL.UnitTests.csproj -c Release --filter 'FullyQualifiedName~CompiledSequentialTests' --logger 'trx;LogFileName=compiled-simulator.trx'
      - name: Correctness before CPU benchmarks
        run: |
          export DOTNET_ROOT="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          bash tests/benchmark-tinyrisc-backends.sh
      - name: Simple arithmetic steady-state throughput
        run: dotnet run --project tools/SharpHDL.SimulatorBench/SharpHDL.SimulatorBench.csproj -c Release -- 200000 | tee generated/tinyrisc/arithmetic-benchmark.log
      - name: Keep logs and compiled RTL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-simulator-evidence
          path: |
            generated/tinyrisc/
            tests/SharpHDL.UnitTests/TestResults/
          if-no-files-found: warn
