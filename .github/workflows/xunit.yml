name: SharpHDL xUnit tests
concurrency:
  group: sharphdl-xunit-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths: ['examples/**', 'tests/Shared/**', 'src/**', 'tests/SharpHDL.UnitTests/**', 'tests/check-project-layers.py', 'tests/rtl/tb_core_hls_elastic.sv', 'tests/rtl/tb_cil_core.sv', 'tools/SharpHDL.CilCoreDemo/**', 'tools/SharpHDL.CoreHlsDemo/**', 'tools/SharpHDL.AxiFirRtlDemo/**', 'src/SharpHDL.RTL/**', 'src/SharpHDL.LegacyRtl/**', 'Makefile', 'global.json', '.github/workflows/xunit.yml']
  pull_request:
    paths: ['examples/**', 'tests/Shared/**', 'src/**', 'tests/SharpHDL.UnitTests/**', '.github/workflows/xunit.yml']
  workflow_dispatch:
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/SharpHDL.UnitTests/SharpHDL.UnitTests.csproj
      - run: dotnet test tests/SharpHDL.UnitTests/SharpHDL.UnitTests.csproj -c Release --no-restore --settings tests/SharpHDL.UnitTests/coverage.runsettings --collect:'XPlat Code Coverage' --logger 'trx;LogFileName=unit-results.trx'
      - name: Explicit AXI FIR regression gate
        run: dotnet test tests/SharpHDL.UnitTests/SharpHDL.UnitTests.csproj -c Release --no-restore --filter "FullyQualifiedName~AxiFir"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
  scheduled-core-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - run: dotnet run --project tools/SharpHDL.AxiFirRtlDemo -c Release -- --suite generated/scheduled-suite
      - name: Independent Icarus and Verilator cycle replay
        run: |
          root="$PWD"
          mkdir -p build/scheduled-suite
          for design in ScheduledTable1 ScheduledTable4 ScheduledTable8 ScheduledCilLoop ScheduledBanksAuto ScheduledBanksXilinxBlock; do
            iverilog -g2012 -s tb -o "build/scheduled-suite/$design" "generated/scheduled-suite/$design.v" "generated/scheduled-suite/${design}_tb.sv"
            (cd generated/scheduled-suite && "$root/build/scheduled-suite/$design")
            verilator --binary --timing -Wno-fatal --top-module tb --Mdir "$root/build/scheduled-suite/$design-obj" "generated/scheduled-suite/$design.v" "generated/scheduled-suite/${design}_tb.sv"
            (cd generated/scheduled-suite && "$root/build/scheduled-suite/$design-obj/Vtb")
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-core-suite
          path: generated/scheduled-suite/
  scheduled-table-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install independent HDL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Generate table RTL after independent array/protocol checks
        run: dotnet run --project tools/SharpHDL.AxiFirRtlDemo -c Release -- --table generated/scheduled-table
      - name: Replay all table depths and check generic synthesis resources
        run: |
          mkdir -p build/scheduled-table
          for width in 1 4 8; do
            iverilog -g2012 -s tb -o "build/scheduled-table/replay-$width" "generated/scheduled-table/ScheduledTable$width.v" "generated/scheduled-table/ScheduledTable${width}_tb.sv"
            vvp "build/scheduled-table/replay-$width"
          done
          yosys -p 'read_verilog generated/scheduled-table/ScheduledTable4.v; hierarchy -check; proc; opt; memory_collect; check -assert; select -assert-count 1 t:$mem_v2; select -assert-count 1 t:$add; stat'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-table-replay
          path: generated/scheduled-table/
  core-layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Enforce Core/HLS/Simulation dependency direction
        run: python3 tests/check-project-layers.py
      - name: Build independent Core IR assembly
        run: dotnet build src/SharpHDL.Core/SharpHDL.Core.csproj -c Release
      - name: Build independent HLS assembly
        run: dotnet build src/SharpHDL.HLS/SharpHDL.HLS.csproj -c Release
      - name: Build independent Simulation assembly
        run: dotnet build src/SharpHDL.Simulation/SharpHDL.Simulation.csproj -c Release
      - name: Build independent RTL assembly
        run: dotnet build src/SharpHDL.RTL/SharpHDL.RTL.csproj -c Release
      - name: Run canonical Core, HLS and Simulation regressions
        run: >
          dotnet test tests/SharpHDL.UnitTests/SharpHDL.UnitTests.csproj
          -c Release
          --filter "FullyQualifiedName~CoreHardwareGraphTests|FullyQualifiedName~CoreGraphLoweringTests|FullyQualifiedName~CoreIrExtendedParityTests|FullyQualifiedName~TinyRiscCoreIrTests|FullyQualifiedName~HlsGraphAnalyzerTests|FullyQualifiedName~HlsElasticCompilerTests|FullyQualifiedName~CoreVerilogEmitterTests|FullyQualifiedName~CoreCilPipelineTests"
  axi-fir-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Generate AXI FIR RTL and cycle reference bench
        run: dotnet run --project tools/SharpHDL.AxiFirRtlDemo/SharpHDL.AxiFirRtlDemo.csproj -c Release -- generated/axi-fir
      - name: Compare generated Verilog against SharpHDL simulation
        run: |
          mkdir -p build/axi-fir
          iverilog -g2012 -s tb -o build/axi-fir/replay generated/axi-fir/AxiFirStructural.v generated/axi-fir/AxiFirStructural_tb.sv
          vvp build/axi-fir/replay
      - name: Upload FIR RTL and replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axi-fir-rtl-replay
          path: |
            generated/axi-fir/*.v
            generated/axi-fir/*.sv
          if-no-files-found: warn
  axi-fir-atomic-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Generate atomic FIR RTL and AXI4-Lite replay
        run: dotnet run --project tools/SharpHDL.AxiFirRtlDemo/SharpHDL.AxiFirRtlDemo.csproj -c Release -- --atomic generated/axi-fir-atomic
      - name: Compare atomic FIR RTL against SharpHDL simulation
        run: |
          mkdir -p build/axi-fir-atomic
          iverilog -g2012 -s tb -o build/axi-fir-atomic/replay generated/axi-fir-atomic/AxiFirAtomicConfigured.v generated/axi-fir-atomic/AxiFirAtomicConfigured_tb.sv
          vvp build/axi-fir-atomic/replay
      - name: Upload atomic FIR replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axi-fir-atomic-replay
          path: generated/axi-fir-atomic/
          if-no-files-found: warn
  axi-fir-ram-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Generate RAM FIR RTL and clocked replay
        run: dotnet run --project tools/SharpHDL.AxiFirRtlDemo/SharpHDL.AxiFirRtlDemo.csproj -c Release -- --ram generated/axi-fir-ram
      - name: Compare RAM FIR RTL against SharpHDL simulation
        run: |
          mkdir -p build/axi-fir-ram
          iverilog -g2012 -s tb -o build/axi-fir-ram/replay generated/axi-fir-ram/AxiFirRam.v generated/axi-fir-ram/AxiFirRam_tb.sv
          vvp build/axi-fir-ram/replay
      - name: Upload RAM FIR replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axi-fir-ram-replay
          path: generated/axi-fir-ram/
          if-no-files-found: warn
  hls-scheduled-fir-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Generate scheduled FIR RTL and independently checked replay
        run: dotnet run --project tools/SharpHDL.AxiFirRtlDemo/SharpHDL.AxiFirRtlDemo.csproj -c Release -- --scheduled generated/hls-scheduled-fir
      - name: Run 2/4/8/16-tap Verilog equivalence
        run: |
          mkdir -p build/hls-scheduled-fir
          for taps in 2 4 8 16; do
            iverilog -g2012 -s tb -o "build/hls-scheduled-fir/replay-$taps" "generated/hls-scheduled-fir/HlsScheduledFir$taps.v" "generated/hls-scheduled-fir/HlsScheduledFir${taps}_tb.sv"
            vvp "build/hls-scheduled-fir/replay-$taps"
          done
      - name: Upload scheduled FIR replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hls-scheduled-fir-replay
          path: generated/hls-scheduled-fir/
          if-no-files-found: warn
  core-hls-verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Compile Core IR into registered RTL
        run: dotnet run --project tools/SharpHDL.CoreHlsDemo/SharpHDL.CoreHlsDemo.csproj -c Release -- "$PWD"
      - name: Verify Core HLS RTL with randomized backpressure
        run: |
          mkdir -p build/core-hls
          mkdir -p build/core-hls/obj
          verilator --binary --timing -Wno-fatal --top-module tb_core_hls_elastic \
            --Mdir build/core-hls/obj \
            generated/core-hls/CoreHlsElastic.v tests/rtl/tb_core_hls_elastic.sv
          build/core-hls/obj/Vtb_core_hls_elastic
  core-rtl-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Build independent Core RTL backend
        run: dotnet build src/SharpHDL.RTL/SharpHDL.RTL.csproj -c Release
      - name: Generate both legacy and native RTL
        run: dotnet run --project tools/SharpHDL.CoreHlsDemo/SharpHDL.CoreHlsDemo.csproj -c Release -- "$PWD"
      - name: Native Core RTL randomized stalls and reset
        run: |
          mkdir -p build/core-hls/native
          verilator --binary --timing -Wno-fatal -DCORE_HLS_NATIVE \
            --top-module tb_core_hls_elastic --Mdir build/core-hls/native \
            generated/core-hls/CoreHlsElasticNative.v tests/rtl/tb_core_hls_elastic.sv
          build/core-hls/native/Vtb_core_hls_elastic
  cil-core-verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Compile production CIL through Core HLS into dual RTL
        run: dotnet run --project tools/SharpHDL.CilCoreDemo/SharpHDL.CilCoreDemo.csproj -c Release -- "$PWD"
      - name: Verify legacy/native RTL and arithmetic under stalls and reset
        run: |
          mkdir -p build/cil-core/obj
          verilator --binary --timing -Wno-fatal --top-module tb_cil_core \
            --Mdir build/cil-core/obj \
            generated/cil-core/CilCoreLegacy.v generated/cil-core/CilCoreNative.v \
            tests/rtl/tb_cil_core.sv
          build/cil-core/obj/Vtb_cil_core
