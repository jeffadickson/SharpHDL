name: SharpHDL VS Code adapter
concurrency:
  group: sharphdl-vscode-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'vscode/sharphdl/**'
      - 'sharphdl.project.json'
      - 'Makefile'
      - 'docs/VSCODE_GETTING_STARTED.md'
      - 'src/SharpHDL/**'
      - 'rtl/amd/**'
      - 'tests/rtl/tb_dsp48e2_mul.sv'
      - 'tools/SharpHDL.MultiplierBench/**'
      - 'tools/compare_multiplier_synthesis.py'
      - 'tools/SharpHDL.Provenance/**'
      - '.github/workflows/vscode-sharphdl.yml'
  pull_request:
    paths:
      - 'vscode/sharphdl/**'
      - '.github/workflows/vscode-sharphdl.yml'
  workflow_dispatch:
jobs:
  extension-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and diagnostic tests
        run: |
          node --check vscode/sharphdl/extension.js
          node --check vscode/sharphdl/verilator.js
          node --check vscode/sharphdl/verificationExplorer.js
          node --check vscode/sharphdl/verificationManifest.js
          node --check vscode/sharphdl/projectIntegration.js
          node --check vscode/sharphdl/projectManifest.js
          node --check vscode/sharphdl/waveformViewer.js
          node --check vscode/sharphdl/vcd.js
          node --check vscode/sharphdl/hardwareBreakpoints.js
          node --test vscode/sharphdl/verilator.test.js vscode/sharphdl/verificationManifest.test.js vscode/sharphdl/projectManifest.test.js vscode/sharphdl/waveform.test.js
          node -e "const p=require('./vscode/sharphdl/package.json'); const commands=p.contributes.commands.map(x=>x.command); if(!commands.includes('sharphdl.verilatorLint') || !commands.includes('sharphdl.verifyTinyRisc') || !p.contributes.views.explorer.some(x=>x.id==='sharphdl.verification')) process.exit(1)"
      - name: Package installable VSIX
        run: |
          mkdir -p dist
          cd vscode/sharphdl
          npx --yes @vscode/vsce@3.6.0 package --no-dependencies --out ../../dist/sharphdl-0.5.0.vsix
          test -s ../../dist/sharphdl-0.5.0.vsix
      - name: Publish extension build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharphdl-vscode-vsix
          path: dist/sharphdl-0.5.0.vsix
  verilator-manifest-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - name: DSP48E2 wrapper behavioral simulation
        run: |
          mkdir -p build/dsp
          iverilog -g2012 -DSHARPH_DL_DSP_BEHAVIORAL -s tb_dsp48e2_mul \
            -o build/dsp/tb_dsp48e2_mul \
            rtl/amd/sharphdl_dsp48e2_mul_unsigned.v tests/rtl/tb_dsp48e2_mul.sv
          vvp build/dsp/tb_dsp48e2_mul
          iverilog -g2012 -DSHARPH_DL_DSP_BEHAVIORAL -s tb_dsp48e2_pipeline \
            -o build/dsp/tb_dsp48e2_pipeline \
            rtl/amd/sharphdl_dsp48e2_mul_pipeline.v tests/rtl/tb_dsp48e2_pipeline.sv
          vvp build/dsp/tb_dsp48e2_pipeline
      - name: Generate real TinyRisc Verilog and verify reference RTL
        run: |
          export DOTNET_ROOT="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          bash tests/run-tinyrisc.sh
      - name: HLS multiplier inference and timing-advisory unit test
        run: dotnet test tests/SharpHDL.UnitTests/SharpHDL.UnitTests.csproj -c Debug --filter 'FullyQualifiedName~Hls_'
      - name: Validate measured architecture selector
        run: python3 -m unittest discover -s tools -p test_select_multiplier_architecture.py
      - name: Generate and synthesize alternative HLS multiplier architectures
        run: |
          dotnet run --project tools/SharpHDL.MultiplierBench/SharpHDL.MultiplierBench.csproj -c Release -- "$PWD"
          python3 tools/compare_multiplier_synthesis.py
      - name: Generate actual CIL-to-RTL provenance
        run: |
          dotnet run --project tools/SharpHDL.Provenance/SharpHDL.Provenance.csproj -c Debug -- "$PWD"
          test -s generated/vscode/ScheduledPolynomial1.v.source-map.json
          python3 -c 'import json; x=json.load(open("generated/vscode/ScheduledPolynomial1.v.source-map.json")); assert x["mappings"], "missing exact CIL source mappings"'
      - name: Compile and run TinyRisc and HLS multi-file Verilator projects with VCD checks
        run: node vscode/sharphdl/cliSmoke.js
  extension-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install VS Code integration test runner
        working-directory: vscode/sharphdl
        run: npm install --no-save --ignore-scripts @vscode/test-electron@2.5.2
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Linux'
        with:
          dotnet-version: '8.0.x'
      - name: Start real SharpHDL localhost simulator (Linux)
        if: runner.os == 'Linux'
        run: |
          dotnet run --project tools/SharpHDL.Live/SharpHDL.Live.csproj -c Release > /tmp/sharphdl-live.log 2>&1 &
          echo $! > /tmp/sharphdl-live.pid
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8093/api/state >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sharphdl-live.log
          exit 1
      - name: Run real extension host (Linux)
        if: runner.os == 'Linux'
        working-directory: vscode/sharphdl
        env:
          SHARPHDL_LIVE_INTEGRATION: '1'
        run: xvfb-run -a node test/runExtensionHost.js
      - name: Run real extension host (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: vscode/sharphdl
        run: node test/runExtensionHost.js
