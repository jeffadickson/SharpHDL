name: SharpHDL HDL integration
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'tests/SharpHDL.IntegrationTests/**', '.github/workflows/hdl-integration.yml']
jobs:
  icarus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: docker info
      - run: dotnet test tests/SharpHDL.IntegrationTests/SharpHDL.IntegrationTests.csproj -c Release --logger 'trx;LogFileName=hdl-integration.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdl-integration-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
