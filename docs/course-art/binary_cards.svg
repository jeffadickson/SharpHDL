<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><rect width="1000" height="370" fill="white"/><text x="500" y="40" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold">Make thirteen with the 8, 4, 2 and 1 cards</text><rect x="80" y="70" width="170" height="217" rx="18" fill="#FFF4DF" stroke="#17324D" stroke-width="3"/><text x="165" y="142" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="bold">8</text><circle cx="165" cy="194" r="23" fill="#26734D" stroke="#17324D" stroke-width="3"/><text x="165" y="256" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal">1 = ON</text><rect x="305" y="70" width="170" height="217" rx="18" fill="#FFF4DF" stroke="#17324D" stroke-width="3"/><text x="390" y="142" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="bold">4</text><circle cx="390" cy="194" r="23" fill="#26734D" stroke="#17324D" stroke-width="3"/><text x="390" y="256" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal">1 = ON</text><rect x="530" y="70" width="170" height="217" rx="18" fill="#E4E9EF" stroke="#17324D" stroke-width="3"/><text x="615" y="142" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="bold">2</text><circle cx="615" cy="194" r="23" fill="#A7B2BE" stroke="#17324D" stroke-width="3"/><text x="615" y="256" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal">0 = OFF</text><rect x="755" y="70" width="170" height="217" rx="18" fill="#FFF4DF" stroke="#17324D" stroke-width="3"/><text x="840" y="142" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="bold">1</text><circle cx="840" cy="194" r="23" fill="#26734D" stroke="#17324D" stroke-width="3"/><text x="840" y="256" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal">1 = ON</text><text x="500" y="339" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold">8 + 4 + 0 + 1 = 13        Binary: 1101</text></svg>