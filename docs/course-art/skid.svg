<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><rect width="1000" height="370" fill="white"/><text x="500" y="35" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold">Cards travel forward. Ready tells the sender when to wait.</text><rect x="25" y="110" width="175" height="145" rx="18" fill="#FFF4DF" stroke="#17324D" stroke-width="3"/><text x="112" y="155" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="normal">Sender</text><text x="112" y="202" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal">next card</text><rect x="300" y="75" width="400" height="215" rx="18" fill="#DFF2F4" stroke="#17324D" stroke-width="3"/><rect x="320" y="115" width="165" height="115" rx="18" fill="white" stroke="#17324D" stroke-width="3"/><text x="402" y="157" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold">SPILL</text><text x="402" y="204" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">Card B</text><rect x="515" y="115" width="165" height="115" rx="18" fill="white" stroke="#17324D" stroke-width="3"/><text x="597" y="157" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold">HEAD</text><text x="597" y="204" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">Card A</text><rect x="800" y="110" width="175" height="145" rx="18" fill="#FFF4DF" stroke="#17324D" stroke-width="3"/><text x="887" y="155" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal">Receiver</text><text x="887" y="204" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold">WAIT</text><line x1="210" y1="175" x2="276" y2="175" stroke="#087E8B" stroke-width="6" stroke-linecap="round"/><path d="M 274 165 L 290 175 L 274 185 Z" fill="#087E8B"/><text x="250.0" y="131" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal">Data</text><text x="250.0" y="151" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal">Valid</text><line x1="224" y1="267" x2="290" y2="267" stroke="#F29E4C" stroke-width="5" stroke-linecap="round"/><path d="M 226 258 L 210 267 L 226 276 Z" fill="#F29E4C"/><text x="250.0" y="310" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal">Ready</text><line x1="710" y1="175" x2="776" y2="175" stroke="#087E8B" stroke-width="6" stroke-linecap="round"/><path d="M 774 165 L 790 175 L 774 185 Z" fill="#087E8B"/><text x="750.0" y="131" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal">Data</text><text x="750.0" y="151" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal">Valid</text><line x1="724" y1="267" x2="790" y2="267" stroke="#F29E4C" stroke-width="5" stroke-linecap="round"/><path d="M 726 258 L 710 267 L 726 276 Z" fill="#F29E4C"/><text x="750.0" y="310" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal">Ready</text><text x="500" y="355" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal">A card transfers only when Valid AND Ready are 1 at the clock edge.</text></svg>