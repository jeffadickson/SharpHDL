<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><rect width="1000" height="370" fill="white"/><text x="500" y="45" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold">A waiting tray saves the extra card when the receiver stops</text><rect x="45" y="125" width="180" height="150" rx="18" fill="#FFF4DF" stroke="#17324D" stroke-width="3"/><text x="135" y="169" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="normal">Sender</text><text x="135" y="218" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal">next card</text><line x1="230" y1="210" x2="309" y2="210" stroke="#087E8B" stroke-width="6" stroke-linecap="round"/><path d="M 307 200 L 323 210 L 307 220 Z" fill="#087E8B"/><rect x="332" y="88" width="410" height="200" rx="18" fill="#DFF2F4" stroke="#17324D" stroke-width="3"/><rect x="355" y="128" width="155" height="110" rx="18" fill="white" stroke="#17324D" stroke-width="3"/><rect x="557" y="128" width="155" height="110" rx="18" fill="white" stroke="#17324D" stroke-width="3"/><text x="432" y="175" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold">HEAD</text><text x="432" y="216" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal">Card A</text><text x="634" y="175" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold">SPILL</text><text x="634" y="216" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal">Card B</text><line x1="750" y1="210" x2="783" y2="210" stroke="#087E8B" stroke-width="6" stroke-linecap="round"/><path d="M 781 200 L 797 210 L 781 220 Z" fill="#087E8B"/><rect x="805" y="115" width="160" height="163" rx="18" fill="#FFF4DF" stroke="#17324D" stroke-width="3"/><text x="885" y="164" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal">Receiver</text><text x="885" y="220" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold">WAIT</text><text x="500" y="343" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">Both slots full? Tell the sender to wait too. Never lose a card.</text></svg>