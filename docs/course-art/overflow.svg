<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><rect width="1000" height="330" fill="white"/><text x="500" y="45" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold">Four places can hold only four bits</text><text x="130" y="115" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="normal">14 + 2 = 16</text><rect x="275" y="90" width="100" height="140" rx="18" fill="#FFF4DF" stroke="#17324D" stroke-width="3"/><text x="325" y="180" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="68" font-weight="bold">1</text><text x="325" y="266" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">16</text><rect x="400" y="90" width="100" height="140" rx="18" fill="#DFF2F4" stroke="#17324D" stroke-width="3"/><text x="450" y="180" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="68" font-weight="bold">0</text><text x="450" y="266" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">8</text><rect x="525" y="90" width="100" height="140" rx="18" fill="#DFF2F4" stroke="#17324D" stroke-width="3"/><text x="575" y="180" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="68" font-weight="bold">0</text><text x="575" y="266" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">4</text><rect x="650" y="90" width="100" height="140" rx="18" fill="#DFF2F4" stroke="#17324D" stroke-width="3"/><text x="700" y="180" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="68" font-weight="bold">0</text><text x="700" y="266" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">2</text><rect x="775" y="90" width="100" height="140" rx="18" fill="#DFF2F4" stroke="#17324D" stroke-width="3"/><text x="825" y="180" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="68" font-weight="bold">0</text><text x="825" y="266" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">1</text><rect x="393" y="80" width="493" height="162" rx="13" fill="none" stroke="#087E8B" stroke-width="3"/><text x="317" y="315" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal">Carry leaves</text><text x="637" y="315" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold">Keep these four: 0000 = 0</text></svg>