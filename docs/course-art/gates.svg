D" stroke="#17324D" stroke-width="3"/><text x="615" y="184" fill="white" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">1</text><line x1="645" y1="175" x2="745" y2="215" stroke="#087E8B" stroke-width="4" stroke-linecap="round"/><circle cx="615" cy="255" r="27" fill="#E4E9EF" stroke="#17324D" stroke-width="3"/><text x="615" y="264" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">0</text><line x1="645" y1="255" x2="745" y2="215" stroke="#087E8B" stroke-width="4" stroke-linecap="round"/><line x1="750" y1="215" x2="806" y2="215" stroke="#087E8B" stroke-width="6" stroke-linecap="round"/><path d="M 804 205 L 820 215 L 804 225 Z" fill="#087E8B"/><circle cx="875" cy="215" r="35" fill="#26734D" stroke="#17324D" stroke-width="3"/><text x="875" y="225" fill="white" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="normal">1</text><text x="500" y="368" fill="#17324D" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal">1 means ON. 0 means OFF. The rule decides the answer.</text></svg>